# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Clean Swift Package
      run: |
        swift package clean \
        --package-path OxideModules

    - name: Xcode setup
      run: |
        xcodebuild -version
        swift --version

    - name: Build Root
      run: |
        xcodebuild build \
        -scheme Root \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation \
        -skipMacroValidation

    - name: Build Home
      run: | 
        xcodebuild build \
        -scheme Home \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation \
        -skipMacroValidation

    - name: Build Gallery
      run: | 
        xcodebuild build \
        -scheme Gallery \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation \
        -skipMacroValidation

    - name: Build Settings
      run: |
        xcodebuild build \
        -scheme Settings \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation \
        -skipMacroValidation

    # - name: Run Root tests
    #   run: |
    #     xcodebuild test \
    #     -scheme Root \
    #     -destination "$DESTINATION" \
    #     -skipPackagePluginValidation \
    #     -skipMacroValidation

    # - name: Run Home tests
    #   run: |
    #     xcodebuild test \
    #     -scheme Home \
    #     -destination "$DESTINATION" \
    #     -skipPackagePluginValidation \
    #     -skipMacroValidation

    - name: Run Gallery Autocreated tests
      run: |
        swift test \
        --package-path OxideModules \
        --filter Gallery
        -destination "$DESTINATION" \
        -skip-package-plugin-validation \
        -skip-macro-validation

