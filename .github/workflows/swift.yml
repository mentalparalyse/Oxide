# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Xcode setup
      run: |
        xcodebuild -version
        swift --version

    - name: Show available simulators (for debugging)
      run: |
        echo "== Available destinations for scheme 'Root' =="
        xcodebuild -scheme Root -showdestinations
        echo
        echo "== Raw simctl list =="
        xcrun simctl list devices
        
    - name: Detect simulator
      run: |
        echo "➡️ Searching for first available iPhone simulator…"
        DEVICE_LINE=$(xcrun simctl list devices | grep -E "iPhone 16 Pro (.*Shutdown)" | head -n 1)
        if [ -z "$DEVICE_LINE" ]; then
          echo "❌ No suitable iPhone 16 Pro found. Showing all devices:"
          xcrun simctl list devices
          exit 1
        fi
        NAME=$(echo "$DEVICE_LINE" | awk -F '[()]' '{print $1}' | sed 's/[ \t]*$//')
        UDID=$(echo "$DEVICE_LINE" | awk -F '[()]' '{print $2}')
        echo "📱 Selected simulator:"
        echo "  Name: $NAME"
        echo "  UDID: $UDID"
        echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> $GITHUB_ENV
        echo "🚀 Booting simulator…"
        xcrun simctl boot "$UDID" || true
        echo "🪄 Opening Simulator.app with this UDID…"
        open -a Simulator --args -CurrentDeviceUDID "$UDID"
        echo "⏳ Waiting for the system to settle…"
        xcrun simctl bootstatus "$UDID" -b

    - name: Print selected destination
      run: echo "$DESTINATION"

    - name: Build Root
      run: |
        xcodebuild build \
        -scheme Root \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Home
      run: |
        xcodebuild build \
        -scheme Home \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Gallery
      run: |
        xcodebuild build \
        -scheme Gallery \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Settings
      run: |
        xcodebuild build \
        -scheme Settings \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Root tests
      run: |
        xcodebuild test \
        -scheme Root \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Home tests
      run: |
        xcodebuild test \
        -scheme Home \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Gallery tests
      run: |
        xcodebuild test \
        -scheme Gallery \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Settings tests
      run: |
        xcodebuild test \
        -scheme Settings \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation



      
