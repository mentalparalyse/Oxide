name: Swift CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        scheme:
          - Root
          - Home
          - Gallery
          - Settings
          - ImageProcessor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test ${{ matrix.scheme }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Oxide.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
