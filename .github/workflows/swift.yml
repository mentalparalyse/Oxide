# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    env:
      IOS_DESTINATION: "platform=iOS Simulator,name=iPhone 15 Pro Max,OS=17.4"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache SwiftPM
      uses: actions/cache@v4
      with:
        path: ./OxideModules
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Xcode setup
      run: |
        xcodebuild -version
        swift --version

    - name: Build AppCore
      run: xcrun swift build --target AppCore --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Build Root
      run: xcrun swift build --target Root --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Build Home
      run: xcrun swift build --target Home --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Build Gallery
      run: xcrun swift build --target Gallery --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Build Settings
      run: xcrun swift build --target Settings --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Run Root tests
      run: xcrun swift test --target RootTests --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Run Home tests
      run: xcrun swift test --target HomeTests --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Run Gallery tests
      run: xcrun swift test --target GalleryTests --destination "$IOS_DESTINATION"
      working-directory: OxideModules

    - name: Run Settings tests
      run: xcrun swift test --target SettingsTests --destination "$IOS_DESTINATION"
      working-directory: OxideModules

      
