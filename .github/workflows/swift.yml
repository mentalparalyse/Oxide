name: Swift CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test OxideModules
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test package
        working-directory: OxideModules
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OxideModules-Package \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
