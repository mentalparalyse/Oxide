# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.4'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-deriveddata-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    - name: Xcode setup
      run: |
        xcodebuild -version
        swift --version
        
    - name: Build Root
      run: |
        xcodebuild build \
        -scheme Root \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Home
      run: | 
        xcodebuild build \
        -scheme Home \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Gallery
      run: | 
        xcodebuild build \
        -scheme Gallery \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Build Settings
      run: |
        xcodebuild build \
        -scheme Settings \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Root tests
      run: |
        xcodebuild test \
        -scheme Root \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Home tests
      run: |
        xcodebuild test \
        -scheme Home \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Gallery tests
      run: |
        xcodebuild test \
        -scheme Gallery \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation

    - name: Run Settings tests
      run: |
        xcodebuild test \
        -scheme Settings \
        -destination "$DESTINATION" \
        -skipPackagePluginValidation


      
